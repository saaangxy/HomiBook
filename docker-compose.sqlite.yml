# SQLite 版 Docker 部署（最简）
#
# 只需前端 + 后端，数据库为 SQLite 文件，持久化在卷中。
# 无需额外数据库服务，适合个人/家庭单机部署。
#
# 启动：docker compose -f docker-compose.sqlite.yml up -d --build
# 访问：http://<服务器IP>:8080
# 端口/密钥可通过根目录 .env 覆盖（参见 .env.example）

services:
  backend:
    build: ./backend
    container_name: homibook-backend
    restart: unless-stopped
    environment:
      # 后端服务端口
      PORT: ${BACKEND_PORT:-3002}
      # SQLite 文件数据库，持久化在 homibook-data 卷
      DATABASE_URL: file:/app/data/dev.db
      # 务必在 .env 中修改为随机长字符串
      JWT_SECRET: ${JWT_SECRET:-homibook-secret-key-change-in-production}
    volumes:
      - homibook-data:/app/data        # SQLite 数据库文件
      - homibook-uploads:/app/uploads  # 上传的小票/账单文件
    ports:
      # 可选：直接从外部访问后端 API / docs（不需要可注释掉）
      - "${BACKEND_EXPOSE_PORT:-3002}:${BACKEND_PORT:-3002}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:'+(process.env.PORT||3002)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build: ./frontend
    container_name: homibook-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Nginx 反向代理目标
      BACKEND_HOST: backend
      BACKEND_PORT: ${BACKEND_PORT:-3002}
    ports:
      # 外部访问入口
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  homibook-data:
  homibook-uploads:
