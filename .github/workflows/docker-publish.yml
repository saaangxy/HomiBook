name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # Docker 镜像：构建并推送 DockerHub（latest + 版本 tag）
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version
        id: tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/homibook:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/homibook:${{ steps.tag.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Mobile APK：expo prebuild 生成原生工程后 gradle 构建 release APK（debug keystore 签名，可直接安装）
  mobile-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      # 版本号跟随 tag（v1.2.3 -> 1.2.3），versionCode 用 workflow 运行号保证递增
      - name: Set version from tag
        working-directory: mobile
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            app.expo.version = '$VERSION';
            app.expo.android.versionCode = '$VERSION_CODE';
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2));
          "
          echo "version=$VERSION versionCode=$VERSION_CODE"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Expo prebuild (android)
        working-directory: mobile
        run: npx expo prebuild -p android --no-install

      # 按 CPU 架构分包（arm64-v8a / armeabi-v7a / x86_64 + universal）；
      # 调大 gradle/kotlin JVM 内存（runner 上 lint/dex 合并会 Metaspace OOM）并禁用 release lint
      - name: Configure android build
        working-directory: mobile
        run: |
          node <<'EOF'
          const fs = require('fs');
          // 1) app/build.gradle: 注入 ABI splits
          const gp = 'android/app/build.gradle';
          let s = fs.readFileSync(gp, 'utf8');
          if (!s.includes('universalApk true')) {
            const block = [
              '    splits {',
              '        abi {',
              '            enable true',
              '            reset()',
              '            include "armeabi-v7a", "arm64-v8a", "x86_64"',
              '            universalApk true',
              '        }',
              '    }'
            ].join('\n');
            s = s.replace('android {', 'android {\n' + block);
            fs.writeFileSync(gp, s);
            console.log('ABI splits enabled');
          }
          // 2) gradle.properties: JVM 内存 + 禁用 lint
          const pp = 'android/gradle.properties';
          let p = fs.readFileSync(pp, 'utf8');
          p = p.replace(/^org\.gradle\.jvmargs=.*$/m, 'org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m');
          if (!/^kotlin\.daemon\.jvmargs=/m.test(p)) p += '\nkotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m';
          if (!/^android\.lint\.enabled=/m.test(p)) p += '\nandroid.lint.enabled=false';
          fs.writeFileSync(pp, p);
          console.log('gradle.properties configured');
          EOF

      - name: Cache gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: mobile/android/app/build/outputs/apk/release/*.apk

  # GitHub Release：挂载 APK（镜像已由 docker job 推送 DockerHub）
  release:
    needs: [docker, mobile-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk

      - name: Rename APKs
        run: |
          for f in apk/*.apk; do
            base=$(basename "$f" .apk)   # app-arm64-v8a-release
            arch=${base#app-}            # arm64-v8a-release
            arch=${arch%-release}        # arm64-v8a / universal
            mv "$f" "homibook-${arch}-${{ github.ref_name }}.apk"
          done
          ls -l homibook-*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: homibook-*.apk
          generate_release_notes: true
