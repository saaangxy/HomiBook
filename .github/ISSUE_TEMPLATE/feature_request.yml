name: ✨ 功能建议
description: 为 HomiBook 提出一个新功能或改进建议
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请描述清楚场景和需求，便于我们评估。
  - type: textarea
    id: problem
    attributes:
      label: 解决的问题
      description: 你现在遇到了什么痛点或不方便的地方？
      placeholder: 我在...的时候需要...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望如何解决？可以描述交互方式、页面位置等
      placeholder: 希望在...页面增加一个...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 是否有其他可接受的替代方案？
    validations:
      required: false
  - type: input
    id: reference
    attributes:
      label: 参考示例
      description: 是否有类似产品/页面可参考？附上链接
    validations:
      required: false
