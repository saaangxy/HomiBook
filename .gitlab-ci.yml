stages:
  - sync

variables:
  # 在 GitLab 项目的 Settings -> CI/CD -> Variables 中配置 GITHUB_TOKEN
  GITHUB_TOKEN: $GITHUB_TOKEN
  # 禁用浅克隆，拉取完整历史（含 tag）
  SYNC_BRANCH: "main"
  GIT_DEPTH: 0

sync-to-github:
  stage: sync
  image:
    name: 10.144.233.86:8082/sang/bitnami/git:latest
    pull_policy: if-not-present
  tags:
    - docker
  timeout: 15 minutes
  variables:
    # 代理仅用于推送 GitHub（fetch 内网 GitLab 不能走代理）；走代理必须降级 HTTP/1.1，否则报 HTTP/2 stream not closed cleanly
    GIT_PROXY_ARGS: "-c http.proxy=http://192.168.1.13:7890 -c https.proxy=http://192.168.1.13:7890 -c http.version=HTTP/1.1"
  script:
    # 添加 GitHub 远程
    - git remote add github https://saaangxy:${GITHUB_TOKEN}@github.com/saaangxy/HomiBook.git
    # 全量 fetch（含 tag）
    # 同步 main 分支
    - git $GIT_PROXY_ARGS push -f github HEAD:main
    # 推送 release tag，触发 GitHub Actions 构建镜像
    - if [ -n "$CI_COMMIT_TAG" ]; then git $GIT_PROXY_ARGS push -f github HEAD:refs/tags/$CI_COMMIT_TAG; fi
  rules:
    # main 分支同步 + tag 触发 release 构建
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $SYNC_BRANCH
      when: always
  retry:
    max: 2
