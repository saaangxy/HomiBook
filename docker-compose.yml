# HomiBook 单容器部署（前端+后端合一，无需 Nginx）
#
# 镜像由 GitHub CI 构建并推送到 DockerHub，部署时直接拉取
# 启动：docker compose up -d
# 访问：http://<服务器IP>:8080

services:
  app:
    image: saaangxy/homibook:${IMAGE_TAG:-latest}
    container_name: homibook
    restart: unless-stopped
    environment:
      PORT: ${PORT:-8080}
      DATABASE_PROVIDER: ${DATABASE_PROVIDER:-sqlite}
      DATABASE_URL: ${DATABASE_URL:-file:/app/data/dev.db}
      JWT_SECRET: ${JWT_SECRET:-homibook-secret-key-change-in-production}
    volumes:
      - homibook-data:/app/data
      - homibook-uploads:/app/uploads
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:'+(process.env.PORT||8080)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

