# HomiBook 单容器部署（前端+后端合一，无需 Nginx）
#
# 启动：docker compose up -d --build
# 访问：http://<服务器IP>:8080
#
# 使用 DockerHub 预构建镜像（无需本地构建）：
#   把 build: . 替换为 image: <你的DockerHub用户名>/homibook:latest

services:
  app:
    build: .
    # image: ${DOCKERHUB_USERNAME:-homibook}/homibook:latest  # 取消注释以用预构建镜像
    container_name: homibook
    restart: unless-stopped
    environment:
      # 服务端口（内部+对外）
      PORT: ${PORT:-8080}
      # 数据库类型: sqlite | mysql | postgresql
      DATABASE_PROVIDER: ${DATABASE_PROVIDER:-sqlite}
      # sqlite: 文件数据库；mysql/postgresql: 对应连接串
      DATABASE_URL: ${DATABASE_URL:-file:/app/data/dev.db}
      # 务必在 .env 中修改
      JWT_SECRET: ${JWT_SECRET:-homibook-secret-key-change-in-production}
    volumes:
      - homibook-data:/app/data        # SQLite 数据库文件
      - homibook-uploads:/app/uploads  # 上传的小票/账单文件
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:'+(process.env.PORT||8080)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # =====================================================
  # 可选数据库服务（默认 SQLite，无需启用）
  # 启用 MySQL:   .env 设 DATABASE_PROVIDER=mysql + DATABASE_URL 指向本服务，然后
  #               docker compose --profile mysql up -d
  # 启用 PostgreSQL: 同理设 DATABASE_PROVIDER=postgresql，然后 --profile postgres
  # =====================================================
  mysql:
    image: mysql:8
    profiles: ["mysql"]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-homibook}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-homibook}
      MYSQL_USER: ${MYSQL_USER:-homibook}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-homibook}
    ports:
      - "3306:3306"
    volumes:
      - homibook-mysql:/var/lib/mysql

  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-homibook}
      POSTGRES_USER: ${POSTGRES_USER:-homibook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-homibook}
    ports:
      - "5432:5432"
    volumes:
      - homibook-postgres:/var/lib/postgresql/data

volumes:
  homibook-data:
  homibook-uploads:
  homibook-mysql:
  homibook-postgres:
